name: Player news

# Timer for the Fantasy Rankings player-news refresh. The work lives in
# the app's /api/player-news endpoint; this workflow only calls it on
# schedule with the CRON_SECRET bearer header (the same call Vercel Cron
# used to make). The refresh records injury / notes changes for fantasy
# players league-wide into shared_player_news (deduped). Each signed-in
# client filters the ticker against their own selected-league roster.
# Moved off Vercel Cron 2026-10-02 so every scheduled job lives in GitHub
# Actions and survives a change of app host: to retarget, set the
# APP_BASE_URL repository variable.
#
# Hourly during Pacific daytime (UTC crons cover both PDT and PST). No
# Pacific-hour skip guard: every scheduled run must call the API and
# assert worked=true (silent success skips were the prior failure mode).
# API-side dedupe makes repeated hourly runs safe. Manual dispatches always run.

on:
  schedule:
    # Mon–Sat Pacific ~06–17 → UTC 13–01 (PDT) and 14–02 (PST)
    - cron: "22 13-23 * * 1-6"
    - cron: "22 0-2 * * 0,2-6"
    # Sun Pacific ~08–17 → UTC 15–01 (PDT) and 16–02 (PST)
    - cron: "22 15-23 * * 0"
    - cron: "22 0-2 * * 0-1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call player-news refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is missing; cannot refresh player news."
            exit 1
          fi
          HTTP=$(curl -sS --max-time 300 -o /tmp/news.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/player-news")
          echo "HTTP $HTTP"
          cat /tmp/news.json
          echo
          python3 - <<'EOF'
          import json, sys
          result = json.load(open("/tmp/news.json"))
          if result.get("ok") is not True:
              raise SystemExit(f"player-news not ok: {result}")
          if result.get("worked") is not True:
              raise SystemExit(f"player-news did no work: {result}")
          print(f"player-news verified: {result}")
          EOF
          test "$HTTP" = "200"
