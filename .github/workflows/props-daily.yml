name: Props daily pull

# Daily Vegas props pull -> consensus projections -> push to the Fantasy
# Rankings Vercel app. Mirrors the local props-twice-daily-pull cron.
#
# GitHub cron is UTC-only and scheduled runs often start hours after the
# cron minute. The job is registered at both 10:17 and 11:17 UTC. On
# schedule, today's pull counts when the stored dashboard rankingsAsOf
# (the ingested projections' built_at, from any producer) falls on today's
# America/Los_Angeles date, or when this workflow already completed the
# "Pull providers and build projections" step today. If the snapshot read
# fails, the guard falls back to the Actions check and says so in the job
# summary. A scheduled run at or after SCHEDULED_PULL_CUTOFF (9:00 AM
# Pacific) does not pull when today's data is still missing. Manual
# dispatches always run. The concurrency group keeps the two crons from
# overlapping so the later run can see the earlier run's result.
#
# Thin Vegas + First Down gap-fill: if Vegas validation fails on the
# player-count minimum alone (validator exit 3, i.e. fewer than 200
# players), the run still keeps a partial Vegas board when it has at
# least one non-K player, scrapes First Down Studio, builds fallback
# projections (source "first_down", K rows copied from the Vegas build),
# and pushes BOTH so the dashboard uses Vegas as primary with First Down
# gap-fill. Empty or kickers-only Vegas files are discarded (First Down
# only). Any other Vegas validation failure is a hard fail. A manual
# dispatch can force First-Down-only with the force_fallback input.

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Force the First Down fallback path (testing)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Shared by both UTC crons and workflow_dispatch so two pulls cannot overlap.
  group: props-daily
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROPS_DATA_DIR: ${{ github.workspace }}/pipeline/data
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      # python3 is preinstalled on the runner. setup-python stays behind
      # this step so a skip does not install the pipeline.
      - name: Skip if today's pull already succeeded
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 .github/scripts/props_daily_guard.py

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r pipeline/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version-file: .nvmrc

      # props_daily_guard.py treats a success of this exact step as today's pull.
      - name: Pull providers and build projections
        if: steps.guard.outputs.go == 'true'
        env:
          OWNER_SLEEPER_USER_ID: ${{ vars.OWNER_SLEEPER_USER_ID }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
          PARLAYAPI_API_KEY: ${{ secrets.PARLAYAPI_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          MONEYLINE_API_KEY: ${{ secrets.MONEYLINE_API_KEY }}
        run: |
          mkdir -p pipeline/data
          bash pipeline/run_twice_daily.sh

      - name: Validate projections
        id: validate
        if: steps.guard.outputs.go == 'true'
        env:
          FORCE_FALLBACK: ${{ inputs.force_fallback }}
        run: |
          FILE=$(ls -t pipeline/data/projections_2026_w*.json | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          WEEK=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["week"])' "$FILE")
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_FALLBACK" = "true" ]; then
            echo "force_fallback set: bypassing Vegas, using First Down only"
            echo "use_fallback=true" >> "$GITHUB_OUTPUT"
            echo "keep_vegas=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 pipeline/scripts/validate_projections.py "$FILE"
          CODE=$?
          set -e
          if [ "$CODE" = "0" ]; then
            echo "use_fallback=false" >> "$GITHUB_OUTPUT"
            echo "keep_vegas=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "3" ]; then
            # Structure must still pass; only the 200-player floor failed.
            python3 pipeline/scripts/validate_projections.py --min-players 0 "$FILE"
            NON_K=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for p in d["projections"] if p.get("position")!="K"))' "$FILE")
            if [ "$NON_K" -ge 1 ]; then
              echo "Vegas yielded fewer than 200 players but has $NON_K non-K: keeping partial Vegas and engaging First Down gap-fill"
              echo "use_fallback=true" >> "$GITHUB_OUTPUT"
              echo "keep_vegas=true" >> "$GITHUB_OUTPUT"
            else
              echo "Vegas board is empty or kickers-only ($NON_K non-K): discarding it, First Down only"
              echo "use_fallback=true" >> "$GITHUB_OUTPUT"
              echo "keep_vegas=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Validation failed with code $CODE (not a player-count failure); failing the run"
            exit 1
          fi

      - name: Build First Down fallback projections
        id: fallback
        if: steps.guard.outputs.go == 'true' && steps.validate.outputs.use_fallback == 'true'
        run: |
          WEEK="${{ steps.validate.outputs.week }}"
          python3 - <<'EOF'
          import urllib.request
          from pathlib import Path
          cache = Path('pipeline/data/sleeper_players_cache.json')
          if not cache.exists():
              req = urllib.request.Request(
                  'https://api.sleeper.app/v1/players/nfl',
                  headers={'User-Agent': 'fantasy-rankings-pipeline'})
              cache.write_bytes(urllib.request.urlopen(req, timeout=120).read())
              print('fetched Sleeper players cache for name matching')
          EOF
          python3 pipeline/scripts/fetch_firstdown_rows.py \
            --week "$WEEK" --season 2026 \
            --out pipeline/data/firstdown_rows.json
          python3 pipeline/scripts/build_firstdown_projections.py \
            --rows pipeline/data/firstdown_rows.json \
            --week "$WEEK" --season 2026
          FD="pipeline/data/projections_firstdown_2026_w${WEEK}.json"
          python3 pipeline/scripts/validate_projections.py --min-players 0 "$FD"
          echo "file=$FD" >> "$GITHUB_OUTPUT"

      - name: Stage projections
        if: steps.guard.outputs.go == 'true'
        run: |
          # staged_for_push is the verify primary: Vegas whenever kept,
          # otherwise First Down. A companion First Down file is staged
          # when both boards are pushed (partial-Vegas gap-fill day).
          rm -f pipeline/data/staged_firstdown_for_push.json
          if [ "${{ steps.validate.outputs.keep_vegas }}" = "true" ]; then
            cp "${{ steps.validate.outputs.file }}" pipeline/data/staged_for_push.json
            if [ "${{ steps.validate.outputs.use_fallback }}" = "true" ]; then
              cp "${{ steps.fallback.outputs.file }}" pipeline/data/staged_firstdown_for_push.json
            fi
          else
            cp "${{ steps.fallback.outputs.file }}" pipeline/data/staged_for_push.json
          fi

      - name: Stage prop line snapshots
        if: steps.guard.outputs.go == 'true'
        run: |
          WEEK="${{ steps.validate.outputs.week }}"
          CONSENSUS="pipeline/data/consensus_2026_w${WEEK}.json"
          test -f "$CONSENSUS"
          python3 - <<EOF
          import json
          from pathlib import Path
          src = Path("$CONSENSUS")
          payload = json.loads(src.read_text())
          pulled_at = (payload.get("built_at") or payload.get("pulled_at") or "")
          pulled_at = pulled_at.replace("+00:00", "Z")
          staged = {
              "season": payload["season"],
              "week": payload["week"],
              "pulled_at": pulled_at,
              "consensus": payload["consensus"],
          }
          assert staged["pulled_at"], "consensus file missing built_at/pulled_at"
          out = Path("pipeline/data/staged_prop_line_snapshots.json")
          out.write_text(json.dumps(staged))
          print(f"staged {len(staged['consensus'])} consensus rows from {src}")
          EOF

      - name: Push projections to Vercel
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Preserve the verify primary, then push it (Vegas when kept) before
          # any First Down companion so both land under distinct snapshot ids.
          cp pipeline/data/staged_for_push.json pipeline/data/staged_verify_primary.json
          for STAGED in pipeline/data/staged_verify_primary.json pipeline/data/staged_firstdown_for_push.json; do
            if [ ! -f "$STAGED" ]; then
              continue
            fi
            cp "$STAGED" pipeline/data/staged_for_push.json
            LABEL=$(basename "$STAGED" .json)
            python3 pipeline/scripts/push_ingest.py projections | tee "/tmp/push_${LABEL}.json"
            RESULT_FILE="/tmp/push_${LABEL}.json" STAGED_FILE="$STAGED" LABEL="$LABEL" python3 - <<'PY'
          import json, os
          result = json.load(open(os.environ["RESULT_FILE"]))
          staged = json.load(open(os.environ["STAGED_FILE"]))
          label = os.environ["LABEL"]
          expected = len(staged["projections"])
          assert result.get("ok") is True, f"push not ok ({label}): {result}"
          assert result.get("status") == "committed", f"unexpected push status ({label}): {result}"
          assert result.get("savedProjections") == expected, (
              f"savedProjections {result.get('savedProjections')} != staged {expected} ({label})"
          )
          print(f"push verified ({label}): committed, savedProjections={expected}, source={staged.get('source')}")
          PY
          done
          cp pipeline/data/staged_verify_primary.json pipeline/data/staged_for_push.json

      - name: Push prop line snapshots to Vercel
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 pipeline/scripts/push_ingest.py prop-line-snapshots | tee /tmp/push_prop_lines.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/push_prop_lines.json'))
          staged = json.load(open('pipeline/data/staged_prop_line_snapshots.json'))
          assert result.get('ok') is True, f"push not ok: {result}"
          assert result.get('status') == 'committed', f"unexpected push status: {result}"
          assert result.get('received') == len(staged['consensus']), \
              f"received {result.get('received')} != staged {len(staged['consensus'])}"
          assert result.get('inserted', 0) >= 0, f"missing inserted: {result}"
          print(
              f"prop-line push verified: received={result.get('received')} "
              f"resolved={result.get('resolved')} inserted={result.get('inserted')} "
              f"unresolved={result.get('unresolved')}"
          )
          EOF

      - name: Pull and push Sleeper Picks board
        if: steps.guard.outputs.go == 'true'
        # Reference data only: a Sleeper outage must never fail the run
        # and block the strength-of-schedule push or dashboard rebuild.
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          # The Picks board is public (no auth). Stage the NFL slice raw;
          # the ingest endpoint owns stat mapping and normalization.
          with urllib.request.urlopen("https://api.sleeper.app/lines/available", timeout=60) as resp:
              board = json.load(resp)
          nfl = [item for item in board if item.get("sport") == "nfl"]
          staged_props = json.load(open("pipeline/data/staged_prop_line_snapshots.json"))
          pulled_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          staged = {
              "season": staged_props["season"],
              "week": staged_props["week"],
              "pulled_at": pulled_at,
              "lines": nfl,
          }
          out = Path("pipeline/data/staged_sleeper_picks.json")
          out.write_text(json.dumps(staged))
          print(f"staged {len(nfl)} NFL Sleeper Picks markets")
          EOF
          python3 pipeline/scripts/push_ingest.py sleeper-picks | tee /tmp/push_sleeper_picks.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/push_sleeper_picks.json'))
          staged = json.load(open('pipeline/data/staged_sleeper_picks.json'))
          assert result.get('ok') is True, f"push not ok: {result}"
          assert result.get('status') == 'committed', f"unexpected push status: {result}"
          assert result.get('received') == len(staged['lines']), \
              f"received {result.get('received')} != staged {len(staged['lines'])}"
          print(f"sleeper-picks push verified: received={result.get('received')} stored={result.get('stored')}")
          EOF

      - name: Build strength of schedule
        if: steps.guard.outputs.go == 'true'
        run: node pipeline/build_matchup_grades.mjs

      - name: Validate strength of schedule
        if: steps.guard.outputs.go == 'true'
        run: python3 pipeline/scripts/validate_matchup_grades.py pipeline/data/staged_matchup_grades.json

      - name: Push strength of schedule
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 pipeline/scripts/push_ingest.py matchup-grades | tee /tmp/push_sos.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/push_sos.json'))
          assert result.get('ok') is True, f"push not ok: {result}"
          assert result.get('status') in ('committed', 'ignored'), f"unexpected status: {result}"
          print(f"SoS push verified: {result['status']}, throughWeek {result.get('throughWeek')}")
          EOF

      - name: Force dashboard rebuild
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=rebuild-dashboard" \
            | tee /tmp/rebuild.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/rebuild.json'))
          assert result.get('ok') is True and result.get('status') == 'ok', f"rebuild failed: {result}"
          assert (result.get('leagues') or 0) >= 1, f"rebuild leagues: {result}"
          print(f"rebuild verified: week {result.get('week')}, asOf {result.get('asOf')}")
          EOF

      - name: Verify stored dashboard snapshot against staged files
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 pipeline/scripts/verify_dashboard.py \
            pipeline/data/staged_for_push.json \
            pipeline/data/staged_matchup_grades.json
