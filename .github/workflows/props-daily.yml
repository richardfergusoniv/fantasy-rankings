name: Props daily pull

# Daily Vegas props pull -> consensus projections -> push to the Fantasy
# Rankings Vercel app. Mirrors the local props-twice-daily-pull cron.
#
# GitHub cron is UTC-only and does not follow daylight saving, so the job
# is scheduled at both 10:00 and 11:00 UTC and a guard step lets it run
# only when it is 03:xx in America/Los_Angeles (3 AM Pacific year-round).
# Manual dispatches always run.
#
# First Down fallback: if Vegas validation fails on the player-count
# minimum alone (validator exit 3, i.e. fewer than 200 players), the run
# scrapes First Down Studio's rankings, builds fallback projections
# (source "first_down", >= 150 players, K rows copied from the Vegas
# build), validates and stages those instead, and pushes normally.
# Any other validation failure is a hard fail. A manual dispatch can
# force the fallback path with the force_fallback input (used to test
# the fallback end to end).

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Force the First Down fallback path (testing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: props-daily
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROPS_DATA_DIR: ${{ github.workspace }}/pipeline/data
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pacific-time guard (scheduled runs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(TZ=America/Los_Angeles date +%H)
            if [ "$HOUR" != "03" ]; then
              echo "Skipping: Pacific hour is $HOUR, not 03."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r pipeline/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: "20"

      - name: Pull providers and build projections
        if: steps.guard.outputs.go == 'true'
        env:
          OWNER_SLEEPER_USER_ID: ${{ vars.OWNER_SLEEPER_USER_ID }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          SHARPAPI_API_KEY: ${{ secrets.SHARPAPI_API_KEY }}
          PARLAYAPI_API_KEY: ${{ secrets.PARLAYAPI_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          MONEYLINE_API_KEY: ${{ secrets.MONEYLINE_API_KEY }}
        run: |
          mkdir -p pipeline/data
          bash pipeline/run_twice_daily.sh

      - name: Validate projections
        id: validate
        if: steps.guard.outputs.go == 'true'
        env:
          FORCE_FALLBACK: ${{ inputs.force_fallback }}
        run: |
          FILE=$(ls -t pipeline/data/projections_2026_w*.json | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          WEEK=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["week"])' "$FILE")
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_FALLBACK" = "true" ]; then
            echo "force_fallback set: bypassing Vegas validation, using First Down fallback"
            echo "use_fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 pipeline/scripts/validate_projections.py "$FILE"
          CODE=$?
          set -e
          if [ "$CODE" = "0" ]; then
            echo "use_fallback=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "3" ]; then
            echo "Vegas yielded fewer than 200 players: engaging First Down fallback"
            echo "use_fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "Validation failed with code $CODE (not a player-count failure); failing the run"
            exit 1
          fi

      - name: Build First Down fallback projections
        id: fallback
        if: steps.guard.outputs.go == 'true' && steps.validate.outputs.use_fallback == 'true'
        run: |
          WEEK="${{ steps.validate.outputs.week }}"
          python3 - <<'EOF'
          import urllib.request
          from pathlib import Path
          cache = Path('pipeline/data/sleeper_players_cache.json')
          if not cache.exists():
              req = urllib.request.Request(
                  'https://api.sleeper.app/v1/players/nfl',
                  headers={'User-Agent': 'fantasy-rankings-pipeline'})
              cache.write_bytes(urllib.request.urlopen(req, timeout=120).read())
              print('fetched Sleeper players cache for name matching')
          EOF
          python3 pipeline/scripts/fetch_firstdown_rows.py \
            --week "$WEEK" --season 2026 \
            --out pipeline/data/firstdown_rows.json
          python3 pipeline/scripts/build_firstdown_projections.py \
            --rows pipeline/data/firstdown_rows.json \
            --week "$WEEK" --season 2026
          FD="pipeline/data/projections_firstdown_2026_w${WEEK}.json"
          python3 pipeline/scripts/validate_projections.py --min-players 150 "$FD"
          echo "file=$FD" >> "$GITHUB_OUTPUT"

      - name: Stage projections
        if: steps.guard.outputs.go == 'true'
        run: |
          if [ "${{ steps.validate.outputs.use_fallback }}" = "true" ]; then
            cp "${{ steps.fallback.outputs.file }}" pipeline/data/staged_for_push.json
          else
            cp "${{ steps.validate.outputs.file }}" pipeline/data/staged_for_push.json
          fi

      - name: Push projections to Vercel
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 pipeline/scripts/push_ingest.py projections | tee /tmp/push_projections.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/push_projections.json'))
          staged = json.load(open('pipeline/data/staged_for_push.json'))
          expected = len(staged['projections'])
          assert result.get('ok') is True, f"push not ok: {result}"
          assert result.get('status') == 'committed', f"unexpected push status: {result}"
          assert result.get('savedProjections') == expected, \
              f"savedProjections {result.get('savedProjections')} != staged {expected}"
          print(f"push verified: committed, savedProjections={expected}")
          EOF

      - name: Build strength of schedule
        if: steps.guard.outputs.go == 'true'
        run: node pipeline/build_matchup_grades.mjs

      - name: Validate strength of schedule
        if: steps.guard.outputs.go == 'true'
        run: python3 pipeline/scripts/validate_matchup_grades.py pipeline/data/staged_matchup_grades.json

      - name: Push strength of schedule
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 pipeline/scripts/push_ingest.py matchup-grades | tee /tmp/push_sos.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/push_sos.json'))
          assert result.get('ok') is True, f"push not ok: {result}"
          assert result.get('status') in ('committed', 'ignored'), f"unexpected status: {result}"
          print(f"SoS push verified: {result['status']}, throughWeek {result.get('throughWeek')}")
          EOF

      - name: Force dashboard rebuild
        if: steps.guard.outputs.go == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=rebuild-dashboard" \
            | tee /tmp/rebuild.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/rebuild.json'))
          assert result.get('ok') is True and result.get('status') == 'ok', f"rebuild failed: {result}"
          assert result.get('leagues') == 6, f"rebuild leagues: {result}"
          print(f"rebuild verified: week {result.get('week')}, asOf {result.get('asOf')}")
          EOF

      - name: Verify public dashboard against staged files
        if: steps.guard.outputs.go == 'true'
        run: |
          python3 pipeline/scripts/verify_dashboard.py \
            pipeline/data/staged_for_push.json \
            pipeline/data/staged_matchup_grades.json
