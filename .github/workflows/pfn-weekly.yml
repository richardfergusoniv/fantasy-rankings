name: PFN weekly pull

# Weekly Pro Football Network table scrape -> push to the Fantasy
# Rankings Vercel app when the data changed. Mirrors the local
# pfn-weekly-pull cron (Wednesdays 7:22 AM Pacific).
#
# Single UTC cron (PDT offset). GitHub often starts scheduled runs hours
# late, so a Pacific-hour skip guard would drop every run. The scrape
# already no-ops when table data is unchanged (status: unchanged), so
# every scheduled trigger can run the job. Manual dispatches always run.
#
# Change-detection state (.last_hash.json, latest.json, snapshots) lives
# in pipeline/pfn/data inside the repo; after a changed run the workflow
# commits the refreshed state back so the next run can diff against it.

on:
  schedule:
    - cron: "22 14 * * 3" # ~07:22 Pacific Wednesday (PDT); drifts with DST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfn-weekly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PFN_DATA_DIR: ${{ github.workspace }}/pipeline/pfn/data
      PROPS_DATA_DIR: ${{ github.workspace }}/pipeline/data
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape PFN tables
        id: scrape
        run: |
          python3 pipeline/pfn/scrape.py | tee /tmp/pfn_scrape.log
          if grep -q "^status: changed" /tmp/pfn_scrape.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push PFN tables to Vercel (only when changed)
        if: steps.scrape.outputs.changed == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 pipeline/scripts/push_ingest.py pfn-tables

      - name: Commit refreshed PFN state back to the repo
        if: steps.scrape.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/pfn/data
          git commit -m "PFN tables update $(date -u +%Y-%m-%d)"
          git push
