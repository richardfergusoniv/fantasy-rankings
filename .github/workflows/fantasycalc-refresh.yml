name: FantasyCalc refresh

# Timer for the daily FantasyCalc preset-cache refresh. The work lives in
# the app's /api/cron/jobs endpoint; this workflow only calls it on
# schedule with the CRON_SECRET bearer header (the same call Vercel Cron
# used to make). Moved off Vercel Cron 2026-10-02 so every scheduled job
# lives in GitHub Actions and survives a change of app host: to retarget,
# set the APP_BASE_URL repository variable.
#
# Intended Pacific slot: daily 04:30. Single UTC cron (PDT offset); GitHub
# often starts scheduled runs hours late, so a Pacific-hour skip guard
# would drop every run. The refresh is idempotent — every scheduled
# trigger must call the endpoint. Manual dispatches always run. Runs
# before the dashboard rebuild so the rebuild reads the fresh cache.

on:
  schedule:
    - cron: "30 11 * * *" # ~04:30 Pacific (PDT); drifts with DST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fantasycalc-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call FantasyCalc refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=refresh-fantasycalc" | tee /tmp/fc.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/fc.json'))
          assert result.get('ok') is True, f"refresh not ok: {result}"
          assert result.get('job') == 'refresh-fantasycalc', f"unexpected job: {result}"
          print(f"FantasyCalc refresh verified: {result}")
          EOF
