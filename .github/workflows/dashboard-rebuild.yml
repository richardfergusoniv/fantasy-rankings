name: Dashboard rebuild

# Timer for the owner dashboard rebuild. The work lives in the app's
# /api/cron/jobs endpoint; this workflow only calls it on schedule with
# the CRON_SECRET bearer header (the same call Vercel Cron used to
# make). The written snapshot stays server-side. Signed-out
# /api/dashboard reads do not receive it. Moved off Vercel Cron
# 2026-10-02 so every scheduled job lives
# in GitHub Actions and survives a change of app host: to retarget, set
# the APP_BASE_URL repository variable.
#
# Intended Pacific slots: daily ~05:00 (after the props pull and the
# FantasyCalc refresh) plus Sun ~16:00. One UTC cron per slot (PDT
# offsets); GitHub often starts scheduled runs hours late, so a
# Pacific-hour skip guard would drop every run. The rebuild is
# idempotent — every scheduled trigger must call the endpoint. Manual
# dispatches always run.

on:
  schedule:
    - cron: "0 12 * * *" # ~05:00 Pacific (PDT); drifts with DST
    - cron: "0 23 * * 0" # ~16:00 Pacific Sunday (PDT); drifts with DST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh player insights
        # Expected points, Next Gen Stats, and depth charts.
        # Best effort: the rebuild keeps the last snapshot if this fails.
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
        run: |
          curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=refresh-player-insights"
      - name: Call dashboard rebuild
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
        run: |
          curl -sS --fail-with-body --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=rebuild-dashboard" | tee /tmp/rebuild.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/rebuild.json'))
          assert result.get('ok') is True and result.get('status') == 'ok', f"rebuild failed: {result}"
          assert (result.get('leagues') or 0) >= 1, f"rebuild leagues: {result}"
          print(f"rebuild verified: week {result.get('week')}, asOf {result.get('asOf')}")
          EOF
