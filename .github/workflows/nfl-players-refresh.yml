name: NFL players refresh

# Timer for the daily compact Sleeper player roster cache. The work lives in
# the app's /api/cron/jobs endpoint; this workflow only calls it on schedule
# with the CRON_SECRET bearer header (same pattern as dashboard-rebuild and
# fantasycalc-refresh). Stores team/status identity only under
# nfl-players-roster-v1 — not the full /players/nfl dump — so Supabase egress
# stays low. Runs before the dashboard rebuild so rankings pick up trades,
# releases, and free agents the same day.
#
# Intended Pacific slot: daily ~04:15 (before FantasyCalc ~04:30 and
# dashboard rebuild ~05:00). Single UTC cron (PDT offset); GitHub often
# starts scheduled runs hours late, so a Pacific-hour skip guard would drop
# every run. The refresh is idempotent — every scheduled trigger must call
# the endpoint. Manual dispatches always run.

on:
  schedule:
    - cron: "15 11 * * *" # ~04:15 Pacific (PDT); drifts with DST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-players-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call NFL players refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=refresh-nfl-players" | tee /tmp/nfl-players.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/nfl-players.json'))
          assert result.get('ok') is True, f"refresh not ok: {result}"
          assert result.get('job') == 'refresh-nfl-players', f"unexpected job: {result}"
          assert result.get('status') in ('committed', 'kept-previous'), f"unexpected status: {result}"
          assert (result.get('players') or 0) >= 1000, f"player count too low: {result}"
          print(f"NFL players refresh verified: {result}")
          EOF
