name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test props daily guard
        run: python3 .github/scripts/props_daily_guard_test.py
      - name: Test props aggregator
        working-directory: pipeline
        run: |
          python3 -m pip install -q -r requirements.txt pytest
          python3 -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
