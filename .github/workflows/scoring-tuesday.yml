name: Scoring Tuesday finalize

# After weekend games and Monday Night Football + Tuesday morning
# corrections: refill last week's projection_accuracy actuals (including
# PPFD-from-box-score), snapshot Sleeper trending, and attempt a weights
# refit. All work runs inside the existing /api/cron/jobs endpoint —
# no new Vercel functions.

on:
  schedule:
    # ~14:00 Pacific Tuesday (PDT); drifts with DST
    - cron: "0 21 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoring-tuesday
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://fantasy-rankings-ten.vercel.app' }}
    steps:
      - name: Finalize projection accuracy (last week)
        run: |
          curl -sS --fail-with-body --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=finalize-accuracy" | tee /tmp/finalize.json
          python3 - <<'EOF'
          import json
          result = json.load(open('/tmp/finalize.json'))
          assert result.get('ok') is True, f"finalize-accuracy failed: {result}"
          print(f"finalize-accuracy: week {result.get('week')} updated {result.get('updated')}")
          EOF

      - name: Snapshot Sleeper trending (weekly)
        continue-on-error: true
        run: |
          curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=snapshot-sleeper-trending" | tee /tmp/trending.json

      - name: Scoring weights refit (candidate + guardrails)
        continue-on-error: true
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/jobs?job=scoring-weights-refit" | tee /tmp/refit.json
