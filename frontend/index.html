<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <style>
      html,
      body {
        background: #0e1014;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f5f7;
        }
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f5f7;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0e1014;
      }
    </style>
    <script>
      // Apply a saved light/dark choice before first paint; the app takes over once it loads.
      try {
        var saved = localStorage.getItem("fantasy-rankings-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
          var color = saved === "light" ? "#f4f5f7" : "#0e1014";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("data-system-content", metas[i].getAttribute("content"));
            metas[i].setAttribute("content", color);
          }
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="data:," />
    <title>Fantasy Rankings</title>
  </head>
  <body>
    <!-- The loading screen, drawn before any script runs. Same markup as components/boot-screen.tsx (a test checks it). -->
    <div id="root"><div class="boot-screen" id="boot-screen" role="status" aria-busy="true" aria-label="Loading" hidden><div class="boot-head"><span class="live-dot"></span><span class="boot-bar boot-bar-week"></span></div><div class="boot-body"><span class="boot-bar boot-bar-heading"></span><div class="boot-row"><span class="boot-bar boot-bar-title"></span><span class="boot-bar boot-bar-value"></span><span class="boot-bar boot-bar-sub"></span></div><div class="boot-row"><span class="boot-bar boot-bar-title"></span><span class="boot-bar boot-bar-value"></span><span class="boot-bar boot-bar-sub"></span></div><div class="boot-row"><span class="boot-bar boot-bar-title"></span><span class="boot-bar boot-bar-value"></span><span class="boot-bar boot-bar-sub"></span></div><div class="boot-row"><span class="boot-bar boot-bar-title"></span><span class="boot-bar boot-bar-value"></span><span class="boot-bar boot-bar-sub"></span></div><div class="boot-row"><span class="boot-bar boot-bar-title"></span><span class="boot-bar boot-bar-value"></span><span class="boot-bar boot-bar-sub"></span></div><div class="boot-row"><span class="boot-bar boot-bar-title"></span><span class="boot-bar boot-bar-value"></span><span class="boot-bar boot-bar-sub"></span></div></div></div></div>
    <script>
      // Show it only when a sign-in is saved; otherwise the sign-in page is next, not the app.
      try {
        for (var k = 0; k < localStorage.length; k++) {
          if (/^sb-.*-auth-token$/.test(localStorage.key(k) || "")) {
            document.getElementById("boot-screen").hidden = false;
            break;
          }
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
