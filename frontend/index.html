<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <style>
      html,
      body {
        background: #0e1014;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f5f7;
        }
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f5f7;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0e1014;
      }
    </style>
    <script>
      // Apply a saved light/dark choice before first paint; the app takes over once it loads.
      try {
        var saved = localStorage.getItem("fantasy-rankings-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
          var color = saved === "light" ? "#f4f5f7" : "#0e1014";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("data-system-content", metas[i].getAttribute("content"));
            metas[i].setAttribute("content", color);
          }
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="data:," />
    <title>Fantasy Rankings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
